name: Native macOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'macOS/**'
      - 'resources/icon.icns'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'macOS/**'
      - 'resources/icon.icns'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal sandboxed app and run native regressions
        run: make test
